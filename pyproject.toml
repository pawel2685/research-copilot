[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["."]
omit = [".venv/*", "tests/*"]

[tool.coverage.report]
# Like Jest's coverageThreshold: pytest exits non-zero when total coverage is lower.
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
